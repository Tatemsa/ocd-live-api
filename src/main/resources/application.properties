# ===================================================================
# CONFIGURATION GENERALE DE L'APPLICATION
# ===================================================================
spring.application.name=ocd-live-api

# Port du serveur de l'API
server.port=${SERVER_PORT:8085}

# Préfixe global pour toutes les routes de l'API REST (ex: http://localhost:8080/api/...)
server.servlet.context-path=${SERVER_CONTEXT_PATH:/api}

# Encodage des requêtes/réponses
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# ===================================================================
# CONFIGURATION BASE DE DONNEES (DataSource pour JPA & JDBC)
# ===================================================================
# Remarque : Pensez a ajouter le driver correspondant dans le pom.xml (MySQL, PostgreSQL ou H2).
#
# Exemple avec PostgreSQL (recommandé en production) :
# spring.datasource.url=jdbc:postgresql://localhost:5432/ocd_db
# spring.datasource.username=postgres
# spring.datasource.password=postgres
# spring.datasource.driver-class-name=org.postgresql.Driver

# Exemple avec MySQL (configurable via variables d'environnement ou paramètres de lancement) :
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ocd}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:bdt}
spring.datasource.password=${DB_PASSWORD:bdt123}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# Configuration du pool de connexions HikariCP
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT:30000}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONN_TIMEOUT:20000}

# ===================================================================
# CONFIGURATION JPA & HIBERNATE
# ===================================================================
# ddl-auto: 'update' (adapte le schéma sans supprimer les données existantes en phase de dev)
# En production, il est recommandé d'utiliser 'validate' ou des migrations (Flyway / Liquibase).
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

# Affichage et formatage des requêtes SQL dans la console
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

# Désactiver Open Session In View (recommandé pour une architecture API REST propre)
spring.jpa.open-in-view=false

# ===================================================================
# CONFIGURATION JWT (JSON Web Token)
# ===================================================================
# Clé secrète encodée en Base64 ou chaîne d'au moins 256 bits (32 octets)
application.security.jwt.secret-key=${JWT_SECRET_KEY:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# Durée de validité du token d'accès en millisecondes (86400000 ms = 24 heures)
application.security.jwt.expiration=${JWT_EXPIRATION:86400000}

# ===================================================================
# CONFIGURATION SWAGGER / OPENAPI (SpringDoc)
# ===================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ===================================================================
# CONFIGURATION INTERNATIONALISATION (I18n)
# ===================================================================
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# ===================================================================
# CONFIGURATION EMAIL (SMTP)
# ===================================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:noreply@ocdlive.com}
spring.mail.password=${MAIL_PASSWORD:changeme}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

application.mail.from=${MAIL_FROM:noreply@ocdlive.com}
application.mail.admin-email=${ADMIN_EMAIL:admin@ocdlive.com}

# ===================================================================
# CONFIGURATION DES LOGS
# ===================================================================
logging.level.root=INFO
logging.level.com.ocdlive.ocd=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
