# ===================================================================
# CONFIGURATION GENERALE DE L'APPLICATION
# ===================================================================
spring.application.name=ocd-live-api

# Port du serveur de l'API
server.port=${SERVER_PORT:8085}

# Prefixe global pour toutes les routes de l'API REST (ex: http://localhost:8080/api/...)
server.servlet.context-path=${SERVER_CONTEXT_PATH:/api}

# Encodage des requetes/reponses
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# ===================================================================
# CONFIGURATION BASE DE DONNEES (DataSource pour JPA & JDBC)
# ===================================================================

# Exemple avec MySQL (configurable via variables d'environnement ou parametres de lancement) :
spring.datasource.url=${DB_URL:jdbc:mariadb://${DB_HOST}:${DB_PORT}/${DB_NAME}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Configuration du pool de connexions HikariCP
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT:30000}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONN_TIMEOUT:20000}

# ===================================================================
# CONFIGURATION JPA & HIBERNATE
# ===================================================================
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

spring.jpa.open-in-view=false
sping.threads.virtual.enabled=true

# ===================================================================
# CONFIGURATION JWT (JSON Web Token)
# ===================================================================
application.security.jwt.secret-key=${JWT_SECRET_KEY}
application.security.jwt.expiration=${JWT_EXPIRATION:86400000}
application.security.jwt.refresh-token.expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ===================================================================
# CONFIGURATION SWAGGER / OPENAPI (SpringDoc)
# ===================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ===================================================================
# CONFIGURATION INTERNATIONALISATION (I18n)
# ===================================================================
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# ===================================================================
# CONFIGURATION EMAIL (SMTP)
# ===================================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout: 5000
spring.mail.properties.mail.smtp.writetimeout: 5000
spring.mail.default-encoding=UTF-8

application.mail.from=${MAIL_FROM}
application.mail.confirmation.token-ttl-hours=24
application.mail.admin-email=${ADMIN_EMAIL}

# ===================================================================
# CONFIGURATION DES LOGS
# ===================================================================
logging.level.root=INFO
logging.level.com.ocdlive.ocd=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
