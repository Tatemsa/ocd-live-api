# ===================================================================
# CONFIGURATION DE TEST (Base de données H2 en mémoire pour CI/CD)
# ===================================================================
spring.application.name=ocd-live-api-test

spring.datasource.url=jdbc:h2:mem:ocd_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Configuration JWT pour les tests de chargement du contexte Spring
application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
application.security.jwt.expiration=86400000

# Configuration Internationalisation (I18n)
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

